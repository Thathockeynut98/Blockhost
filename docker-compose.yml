services:
  blockhost:
    build: .
    container_name: blockhost
    ports:
      - "8080:8080"
      - "25565:25565"
    volumes:
      - ./data:/app/data
      - ./servers:/app/servers
    environment:
      PORT: 8080
      MC_PORT: 25565
      CURSEFORGE_API_KEY: ${CURSEFORGE_API_KEY:-}
    restart: unless-stopped