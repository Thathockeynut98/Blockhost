services:
  blockhost:
    build: .
    container_name: blockhost
    ports:
      - "8080:8080"
    volumes:
      - blockhost_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      PORT: 8080
      TZ: ${TZ:-UTC}
volumes:
  blockhost_data:
